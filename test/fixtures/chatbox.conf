# Chatbox configuration — test fixture
# Used by Docker-based tests against the mock Matrix server

homeserver_url = http://mock:8008
access_token = test_token_123

# Photos from chat land here (the Docker e2e checks it)
photos_dir = /tmp/chatbox-e2e-photos
sleep_photo_viewer_mins = 20

[contacts]
contact.1.name = Mom
contact.1.room_id = !testroom:localhost
contact.1.avatar = mom

contact.2.name = Dad
contact.2.room_id = !room2:localhost
contact.2.avatar = dad
