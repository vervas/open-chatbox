# ~chatbox/.config/wireplumber/wireplumber.conf.d/80-disable-logind.conf
# Headless Pi: chatbox never has an active logind seat, and WirePlumber 0.5
# disables its bluez monitor without one -> `br-connection-profile-unavailable`.
# Installed by deploy/bt-speaker/install.sh (called from setup-pi-system.sh).
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
